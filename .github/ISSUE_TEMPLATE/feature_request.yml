name: Feature request
description: Suggest a new option or behavior
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The flag, config key, or behavior you have in mind, with an example command
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
