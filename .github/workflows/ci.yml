name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- macOS + Linux, GCC & Clang, Make & CMake --------------------------
  unix:
    name: ${{ matrix.os }} / ${{ matrix.cc }} / ${{ matrix.buildsys }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-13]
        cc: [gcc, clang]
        buildsys: [make, cmake]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config libicu-dev libpcre2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install icu4c pcre2 pkg-config
          if [ "${{ matrix.cc }}" = "gcc" ]; then brew install gcc; fi

      - name: Resolve compiler
        id: cc
        run: |
          if [ "${{ matrix.cc }}" = "gcc" ] && [ "${{ runner.os }}" = "macOS" ]; then
            # System "gcc" is a clang shim on macOS; pick the real Homebrew gcc.
            REALCC=$(ls "$(brew --prefix)"/bin/gcc-[0-9]* 2>/dev/null | sort -V | tail -1)
            echo "cc=${REALCC:-gcc}" >> "$GITHUB_OUTPUT"
          else
            echo "cc=${{ matrix.cc }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & test (Make)
        if: matrix.buildsys == 'make'
        run: |
          make CC='${{ steps.cc.outputs.cc }}'
          make check CC='${{ steps.cc.outputs.cc }}'

      - name: Build & test (CMake)
        if: matrix.buildsys == 'cmake'
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER='${{ steps.cc.outputs.cc }}' \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

  # ---- Autotools sanity build (Linux) ------------------------------------
  autotools:
    name: autotools / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            libicu-dev libpcre2-dev
      - name: Configure, build, test (out of tree)
        run: |
          autoreconf --install
          mkdir _build && cd _build
          ../configure
          make
          make check

  # ---- Windows, MSVC via CMake + vcpkg (amd64 tested, arm64 cross) --------
  windows:
    name: windows / ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            triplet: x64-windows
            cmake_arch: x64
            run_tests: true
          - arch: arm64
            triplet: arm64-windows
            cmake_arch: ARM64
            run_tests: false
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (vcpkg)
        shell: pwsh
        run: |
          vcpkg install icu:${{ matrix.triplet }} pcre2:${{ matrix.triplet }}

      - name: Configure & build (CMake / MSVC)
        shell: pwsh
        run: |
          cmake -S . -B build -A ${{ matrix.cmake_arch }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          cmake --build build --config Release

      - name: Test
        if: matrix.run_tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
